<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>생물다양성 비교하기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 10px;
            overscroll-behavior: none; 
        }
        h1 {
            color: #2c3e50;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p.desc {
            color: #2980b9;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            word-break: keep-all;
        }

        /* 두 생태계를 나란히 배치 (PC는 양옆, 모바일은 위아래) */
        .ecosystems-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (max-width: 800px) {
            .ecosystems-wrapper {
                flex-direction: column;
            }
        }

        .ecosystem {
            flex: 1;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #ecf0f1;
        }

        .ecosystem h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 2px dashed #bdc3c7;
        }
        .ecosystem.type-A h2 { color: #8e44ad; }
        .ecosystem.type-B h2 { color: #2980b9; }

        /* 중앙 메인 상자 */
        .main-box {
            width: 100%;
            min-height: 160px;
            background-color: #f8f9fa;
            border: 3px dashed #7f8c8d;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            position: relative;
        }

        /* 분류 블록 컨테이너 */
        .groups-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .drop-zone {
            width: 45%; 
            min-width: 120px;
            flex-grow: 1;
            min-height: 100px;
            background-color: #fdfdfd;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 5px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .drop-zone.hover {
            background-color: #e8f8f5;
            border-color: #1abc9c;
        }

        .zone-title {
            width: 100%;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 8px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
            padding-bottom: 5px;
            font-size: 13px;
        }

        /* 공 스타일 */
        .ball {
            border-radius: 50%;
            cursor: grab;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.3), 2px 2px 4px rgba(0,0,0,0.2);
            touch-action: none; 
            z-index: 10;
        }
        .ball:active { cursor: grabbing; transform: scale(0.9); }

        /* 색깔 (A상자용) */
        .color-purple { background-color: #9b59b6; }
        .color-yellow { background-color: #f1c40f; }
        .color-red    { background-color: #e74c3c; }
        
        /* 색깔 (B상자용) */
        .color-blue   { background-color: #3498db; }
        .color-black  { background-color: #34495e; }
        
        /* 크기 */
        .size-small  { width: 25px; height: 25px; }
        .size-medium { width: 40px; height: 40px; }
        .size-large  { width: 55px; height: 55px; }

        /* 해파리 애니메이션 */
        @keyframes float {
            0% { transform: translate(0, 0); }
            33% { transform: translate(6px, -8px); }
            66% { transform: translate(-6px, 6px); }
            100% { transform: translate(0, 0); }
        }
        .main-box .ball { animation: float 4s ease-in-out infinite; }
        .main-box .ball:nth-child(even) { animation-duration: 5.5s; animation-direction: reverse; }
        .main-box .ball:nth-child(3n) { animation-duration: 4.5s; animation-delay: 1s; }

        /* 하단 버튼 영역 */
        .btn-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn-a { background-color: #9b59b6; color: white; width: 100%; margin-top: 10px; }
        .add-btn-b { background-color: #3498db; color: white; width: 100%; margin-top: 10px; }
        .reset-btn { background-color: #e74c3c; color: white; padding: 12px 30px; font-size: 16px; margin-top: 20px;}
        .reset-btn:hover { background-color: #c0392b; }

        /* 팝업창 (모달) */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        #modal h2 { color: #2c3e50; margin-top: 0; font-size: 22px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .input-group.type-a label { color: #8e44ad; }
        .input-group.type-b label { color: #2980b9; }
        .input-group input {
            width: 100%; padding: 10px; font-size: 14px;
            border: 2px solid #bdc3c7; border-radius: 5px; box-sizing: border-box;
        }
        .confirm-btn { background-color: #2ecc71; color: white; width: 100%; padding: 12px; font-size: 16px; margin-top: 10px;}
        .confirm-btn:hover { background-color: #27ae60; }

    </style>
</head>
<body>

    <h1>생물다양성 비교하기 🌍</h1>
    <p class="desc">
        상자 A와 상자 B의 개체들을 각각의 분류 블록으로 드래그해서 묶어보세요!<br>
        (A상자의 공은 A블록에만, B상자의 공은 B블록에만 들어갑니다)
    </p>

    <div class="ecosystems-wrapper">
        
        <div class="ecosystem type-A">
            <h2>상자 A (다양한 특징)</h2>
            <div id="main-box-a" class="main-box drop-zone" data-type="A" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <div class="groups-container" id="groups-container-a">
                <div class="drop-zone" data-type="A" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="zone-title">A 분류 블록 1</div>
                </div>
                <div class="drop-zone" data-type="A" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="zone-title">A 분류 블록 2</div>
                </div>
            </div>
            <button class="add-btn-a" onclick="addBlock('A')">+ A 블록 추가</button>
        </div>

        <div class="ecosystem type-B">
            <h2>상자 B (단순한 특징)</h2>
            <div id="main-box-b" class="main-box drop-zone" data-type="B" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            <div class="groups-container" id="groups-container-b">
                <div class="drop-zone" data-type="B" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="zone-title">B 분류 블록 1</div>
                </div>
                <div class="drop-zone" data-type="B" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="zone-title">B 분류 블록 2</div>
                </div>
            </div>
            <button class="add-btn-b" onclick="addBlock('B')">+ B 블록 추가</button>
        </div>

    </div>

    <button class="reset-btn" onclick="resetGame()">모든 공 다시 섞기</button>

    <div id="modal-overlay">
        <div id="modal">
            <h2>🎉 모든 분류 완성!</h2>
            <p style="font-size: 14px; color: #7f8c8d; margin-bottom: 20px;">각 상자의 개체들을 어떤 기준으로 묶었나요?</p>
            
            <div class="input-group type-a">
                <label>상자 A 분류 기준</label>
                <input type="text" id="criteria-input-a" placeholder="예: 크기, 색깔 등">
            </div>
            
            <div class="input-group type-b">
                <label>상자 B 분류 기준</label>
                <input type="text" id="criteria-input-b" placeholder="예: 색깔 (크기는 모두 같음)">
            </div>

            <button class="confirm-btn" onclick="applyCriteria()">확인</button>
        </div>
    </div>

    <script>
        // 상자 A 설정 (크기 3종류, 색깔 3종류)
        const colorsA = ['color-purple', 'color-yellow', 'color-red'];
        const sizesA = ['size-small', 'size-medium', 'size-large'];
        const totalBallsA = 18; 
        
        // 상자 B 설정 (크기 대형 고정, 색깔 2종류)
        const colorsB = ['color-blue', 'color-black'];
        const sizesB = ['size-large'];
        const totalBallsB = 12; 

        let blockCountA = 2;
        let blockCountB = 2;

        let activeBall = null;
        let originalParent = null;

        // 1. 게임 초기화
        function initGame() {
            // A 초기화
            document.getElementById('main-box-a').innerHTML = '';
            document.getElementById('groups-container-a').innerHTML = `
                <div class="drop-zone" data-type="A" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="zone-title">A 분류 블록 1</div></div>
                <div class="drop-zone" data-type="A" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="zone-title">A 분류 블록 2</div></div>
            `;
            blockCountA = 2;

            // B 초기화
            document.getElementById('main-box-b').innerHTML = '';
            document.getElementById('groups-container-b').innerHTML = `
                <div class="drop-zone" data-type="B" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="zone-title">B 분류 블록 1</div></div>
                <div class="drop-zone" data-type="B" ondrop="drop(event)" ondragover="allowDrop(event)"><div class="zone-title">B 분류 블록 2</div></div>
            `;
            blockCountB = 2;

            attachDragLeaveListeners();

            // 공 생성 함수
            function createBalls(total, colors, sizes, type, containerId, prefix) {
                const container = document.getElementById(containerId);
                for (let i = 0; i < total; i++) {
                    const ball = document.createElement('div');
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                    
                    ball.className = `ball ${randomColor} ${randomSize}`;
                    ball.draggable = true;
                    ball.id = `ball_${prefix}_${i}`;
                    ball.dataset.type = type; // A 또는 B 소속 태그
                    
                    // 이벤트 리스너 추가
                    ball.addEventListener('dragstart', drag);
                    ball.addEventListener('touchstart', handleTouchStart, {passive: false});
                    ball.addEventListener('touchmove', handleTouchMove, {passive: false});
                    ball.addEventListener('touchend', handleTouchEnd);
                    
                    container.appendChild(ball);
                }
            }

            createBalls(totalBallsA, colorsA, sizesA, 'A', 'main-box-a', 'a');
            createBalls(totalBallsB, colorsB, sizesB, 'B', 'main-box-b', 'b');
        }

        // 2. 모바일 터치 이벤트
        function handleTouchStart(e) {
            activeBall = e.target;
            originalParent = activeBall.parentElement;
            
            const rect = activeBall.getBoundingClientRect();
            activeBall.style.position = 'fixed';
            activeBall.style.left = rect.left + 'px';
            activeBall.style.top = rect.top + 'px';
            activeBall.style.zIndex = '999';
            activeBall.style.animation = 'none';
        }

        function handleTouchMove(e) {
            if (!activeBall) return;
            e.preventDefault();
            const touch = e.touches[0];
            activeBall.style.left = (touch.clientX - activeBall.offsetWidth / 2) + 'px';
            activeBall.style.top = (touch.clientY - activeBall.offsetHeight / 2) + 'px';
        }

        function handleTouchEnd(e) {
            if (!activeBall) return;
            const touch = e.changedTouches[0];
            
            activeBall.style.display = 'none';
            let elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            activeBall.style.display = 'block';

            activeBall.style.position = '';
            activeBall.style.left = '';
            activeBall.style.top = '';
            activeBall.style.zIndex = '';
            activeBall.style.animation = '';

            let dropZone = elemBelow;
            while (dropZone && !dropZone.classList?.contains('drop-zone')) {
                dropZone = dropZone.parentElement;
            }

            // 드롭 대상이 존재하고, 공의 타입(A/B)과 드롭존의 타입이 일치할 때만 허용
            if (dropZone && dropZone.classList.contains('drop-zone') && dropZone.dataset.type === activeBall.dataset.type) {
                dropZone.appendChild(activeBall);
                checkGameComplete();
            } else {
                // 타입이 다르거나 엉뚱한 곳이면 원래 위치로 되돌림
                originalParent.appendChild(activeBall);
            }
            
            activeBall = null;
        }

        // 3. PC 드래그 앤 드롭 로직
        function allowDrop(ev) {
            ev.preventDefault();
            // 현재 드래그 중인 공의 타입은 여기서 바로 알기 어려우므로 호버 효과만 일단 줍니다.
            let target = ev.target;
            while (target && !target.classList.contains('drop-zone')) {
                target = target.parentElement;
            }
            if(target) target.classList.add('hover');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.dataTransfer.setData("type", ev.target.dataset.type);
        }

        function drop(ev) {
            ev.preventDefault();
            const ballId = ev.dataTransfer.getData("text");
            const ballType = ev.dataTransfer.getData("type");
            const draggedElement = document.getElementById(ballId);
            
            let dropZone = ev.target;
            while (dropZone && !dropZone.classList.contains('drop-zone')) {
                dropZone = dropZone.parentElement;
            }

            if (dropZone) {
                dropZone.classList.remove('hover');
                // 공의 타입과 존의 타입이 같을 때만 허용
                if (dropZone.dataset.type === ballType) {
                    dropZone.appendChild(draggedElement);
                    checkGameComplete();
                }
            }
        }

        function attachDragLeaveListeners() {
            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.ondragleave = (ev) => {
                    let target = ev.target;
                    while (target && !target.classList.contains('drop-zone')) {
                        target = target.parentElement;
                    }
                    if(target) target.classList.remove('hover');
                };
            });
        }

        // 4. 블록 추가 함수
        function addBlock(type) {
            let containerId, titlePrefix;
            if (type === 'A') {
                blockCountA++;
                containerId = 'groups-container-a';
                titlePrefix = `A 분류 블록 ${blockCountA}`;
            } else {
                blockCountB++;
                containerId = 'groups-container-b';
                titlePrefix = `B 분류 블록 ${blockCountB}`;
            }

            const container = document.getElementById(containerId);
            const newZone = document.createElement('div');
            newZone.className = 'drop-zone';
            newZone.dataset.type = type;
            newZone.setAttribute('ondrop', 'drop(event)');
            newZone.setAttribute('ondragover', 'allowDrop(event)');
            newZone.innerHTML = `<div class="zone-title">${titlePrefix}</div>`;
            
            container.appendChild(newZone);
            attachDragLeaveListeners();
        }

        // 5. 완료 체크 및 팝업
        function checkGameComplete() {
            const ballsA = document.getElementById('main-box-a').querySelectorAll('.ball').length;
            const ballsB = document.getElementById('main-box-b').querySelectorAll('.ball').length;
            
            // 두 상자의 미분류 공이 모두 0개일 때 완료
            if (ballsA === 0 && ballsB === 0) {
                setTimeout(() => {
                    document.getElementById('modal-overlay').style.display = 'flex';
                    document.getElementById('criteria-input-a').value = '';
                    document.getElementById('criteria-input-b').value = '';
                }, 400);
            }
        }

        function applyCriteria() {
            const inputA = document.getElementById('criteria-input-a').value.trim();
            const inputB = document.getElementById('criteria-input-b').value.trim();
            
            if (inputA === '' || inputB === '') {
                alert("A상자와 B상자의 분류 기준을 모두 입력해주세요!");
                return;
            }

            // A상자 타이틀 업데이트
            document.querySelectorAll('#groups-container-a .zone-title').forEach(title => {
                title.innerText = `기준: ${inputA}`;
                title.style.color = '#8e44ad';
            });

            // B상자 타이틀 업데이트
            document.querySelectorAll('#groups-container-b .zone-title').forEach(title => {
                title.innerText = `기준: ${inputB}`;
                title.style.color = '#2980b9';
            });

            document.getElementById('modal-overlay').style.display = 'none';
        }

        function resetGame() {
            document.getElementById('modal-overlay').style.display = 'none';
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
